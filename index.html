<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiftHub - Find the Perfect Gift</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="top-bar">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="8" width="18" height="13" rx="2"/>
                    <path d="M12 8V4"/>
                    <path d="M8 4h8"/>
                </svg>
                GiftHub
            </div>
            <div class="search-bar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="text" placeholder="Search for gifts...">
            </div>
            <div class="cart-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="9" cy="21" r="1"/>
                    <circle cx="20" cy="21" r="1"/>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                </svg>
            </div>
        </div>
        <nav>
            <button class="nav-btn active">All Gifts</button>
            <button class="nav-btn">Birthday</button>
            <button class="nav-btn">Anniversary</button>
            <button class="nav-btn">Holiday</button>
            <button class="nav-btn">Personalized</button>
            <button class="nav-btn">Jewelry</button>
            <button class="nav-btn">Home & Decor</button>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <div class="hero-text">
                <h1>Find the Perfect Gift for Every Occasion</h1>
                <p>Discover unique and thoughtful gifts that will make your loved ones smile. From personalized treasures to timeless classics, we have something special for everyone.</p>
                <div class="hero-buttons">
                    <button class="btn btn-primary">Shop Now</button>
                    <button class="btn btn-secondary">Gift Guide</button>
                </div>
            </div>
            <div class="hero-image">
                <img src="https://images.unsplash.com/photo-1549465220-1a8b9238cd48?w=600&h=400&fit=crop" alt="Pink gift box with gold ribbon">
            </div>
        </div>
    </section>

    <section class="products-section">
        <div class="section-header">
            <h2>All Gifts</h2>
            <span class="product-count">12 products</span>
        </div>
        <div class="products-grid" id="productsGrid"></div>
    </section>

    <script src="js/main.js"></script>
</body>
</html>
